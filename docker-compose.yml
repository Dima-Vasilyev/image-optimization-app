version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-optimization-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      # Persist temp files and logs across container restarts
      - temp-data:/app/temp
      - log-data:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  temp-data:
  log-data:
